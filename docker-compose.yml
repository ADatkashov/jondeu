# Local stack: PostgreSQL + backend (Spring Boot) + web dashboard (Next.js).
# `docker compose up --build`  ->  web http://localhost:3000, API http://localhost:8080/swagger-ui.html
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jondeu
      POSTGRES_USER: ${DB_USER:-jondeu}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-jondeu} -d jondeu"]
      interval: 5s
      retries: 10
    ports: ["5432:5432"]

  backend:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://db:5432/jondeu
      DB_USER: ${DB_USER:-jondeu}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (>=32 chars) in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DEMO_ENABLED: ${DEMO_ENABLED:-true}
    volumes: [uploads:/data/uploads]
    ports: ["8080:8080"]

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
    depends_on: [backend]
    ports: ["3000:3000"]

volumes:
  dbdata:
  uploads:
